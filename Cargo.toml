[package]
name = "cellular_automata"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
name = "cellular_automata"

[[bin]]
name = "cellular_automata_bin"
path = "src/main.rs"

[dependencies]
fastrand = "2.4.1"
js-sys = "0.3.98"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.121"
